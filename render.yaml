databases:
  - name: construction-ledger-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: construction-ledger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: construction-ledger-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
